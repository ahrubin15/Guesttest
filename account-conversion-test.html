<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subway Exchange — Account Conversion Test</title><style>body{font:16px system-ui;max-width:650px;margin:30px auto;padding:0 18px;color:#17283b}button,input{font:inherit;padding:10px;margin:6px 0;box-sizing:border-box}input{width:100%}button{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4f6;padding:14px}</style><h1>Account Conversion Test</h1><p>Development only. Use the same browser as the purchase test. Do not sign out before verifying your email.</p><button id="inspect">1. Check existing account</button><label>Email (not already registered)<input id="email" type="email" autocomplete="email"></label><button id="send">2. Send verification email</button><button id="verify">3. Check verified account</button><label>New password<input id="password" type="password" autocomplete="new-password" minlength="12"></label><button id="save">4. Set password</button><button id="relogin">5. Test password sign-in</button><pre id="out" role="status">Loading…</pre><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const client=createClient('https://jxymdjkzbjntfbbyjdfa.supabase.co','sb_publishable_DA9X9DoNOhoBYFMdVGh7JQ_Rzk_xRPI',{auth:{storageKey:'subway-exchange-dev-auth-test',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const redirect='https://ahrubin15.github.io/Guesttest/';
const expectedUser='8ea0edb1-c067-4432-97ef-5591e2d4681a', expectedPlayer='e4b23cf0-13f4-43e4-9495-9a76ecf2a148';
const $=id=>document.getElementById(id);const buttons=[...document.querySelectorAll('button')];
function check(r){if(r.error)throw r.error;return r.data;}
async function inspect(){const {user}=check(await client.auth.getUser());if(!user||user.id!==expectedUser)throw Error('Wrong or missing test session. Do not create a new account.');const rows=check(await client.rpc('get_my_player'));const tickets=check(await client.rpc('get_my_tickets'));if(rows.length!==1||rows[0].player_id!==expectedPlayer||Number(rows[0].available_minor)!==100000||tickets.length!==3)throw Error('Unexpected player, balance or ticket count.');return user;}
function verified(u){return u.is_anonymous===false&&!!u.email_confirmed_at&&!!u.email;}
function report(u){return 'Auth user ID unchanged: PASS\nPlayer ID unchanged: PASS\nBalance: 1000 T\nTickets: 3\nAnonymous: '+u.is_anonymous+'\nVerified email: '+(verified(u)?'YES':'NO');}
function action(id,fn){$(id).onclick=async()=>{buttons.forEach(b=>b.disabled=true);try{$('out').textContent='Working…';$('out').textContent=await fn();}catch(e){$('out').textContent='FAIL: '+(e.message||String(e));}finally{buttons.forEach(b=>b.disabled=false);}};}
action('inspect',async()=>report(await inspect()));
action('send',async()=>{const u=await inspect();if(!u.is_anonymous)throw Error('Account is already permanent.');const email=$('email').value.trim();if(!email||!$('email').checkValidity())throw Error('Enter a valid email.');check(await client.auth.updateUser({email},{emailRedirectTo:redirect}));return 'Verification requested. Open the email link in this same browser, then click step 3.';});
action('verify',async()=>{check(await client.auth.refreshSession());const u=await inspect();if(!verified(u))throw Error('Email verification not complete. Check your email link.');return 'PASS: Verified account conversion\n'+report(u);});
action('save',async()=>{const u=await inspect();if(!verified(u))throw Error('Verify email first.');const password=$('password').value;if(password.length<12)throw Error('Use at least 12 characters.');check(await client.auth.updateUser({password}));$('password').value='';return 'PASS: Password saved. Enter it again for step 5.';});
action('relogin',async()=>{const u=await inspect();if(!verified(u))throw Error('Verify email first.');const password=$('password').value;if(password.length<12)throw Error('Enter the password you saved.');const second=createClient('https://jxymdjkzbjntfbbyjdfa.supabase.co','sb_publishable_DA9X9DoNOhoBYFMdVGh7JQ_Rzk_xRPI',{auth:{storageKey:'subway-conversion-relogin-test',persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});try{const {user}=check(await second.auth.signInWithPassword({email:u.email,password}));if(user.id!==expectedUser)throw Error('Sign-in returned a different user.');const p=check(await second.rpc('get_my_player'));const t=check(await second.rpc('get_my_tickets'));if(p.length!==1||p[0].player_id!==expectedPlayer||Number(p[0].available_minor)!==100000||t.length!==3)throw Error('Sign-in did not preserve player history.');return 'PASS: Permanent account sign-in\n'+report(user);}finally{$('password').value='';await second.auth.signOut({scope:'local'});}});
$('out').textContent='Ready. Start with step 1.';
</script></html>
