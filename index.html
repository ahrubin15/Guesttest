<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Subway Exchange — Guest Auth Test</title><style>body{font:16px system-ui;max-width:640px;margin:40px auto;padding:0 20px;color:#18283d}button{font:inherit;padding:12px;margin:5px 5px 5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;padding:16px}button:disabled{opacity:.5}</style></head><body><h1>Guest Authentication & Profile API Test</h1><p>Development only. No live markets or purchases. Reuse this browser session to test persistence.</p><button id="run" disabled>Sign in / initialize guest</button><button id="reset" disabled>Sign out (test a new guest)</button><pre id="out" role="status">Loading authentication library…</pre><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const client=createClient('https://jxymdjkzbjntfbbyjdfa.supabase.co','sb_publishable_DA9X9DoNOhoBYFMdVGh7JQ_Rzk_xRPI',{auth:{storageKey:'subway-exchange-dev-auth-test',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const run=document.querySelector('#run'),reset=document.querySelector('#reset'),out=document.querySelector('#out');
function busy(v){run.disabled=v;reset.disabled=v;}
function check(r){if(r.error)throw r.error;return r.data;}
run.onclick=async()=>{busy(true);out.textContent='Testing…';try{let {session}=check(await client.auth.getSession());if(!session){({session}=check(await client.auth.signInAnonymously()));}if(!session)throw new Error('No session returned');const {user}=check(await client.auth.getUser());const a=check(await client.rpc('initialize_my_player'));const b=check(await client.rpc('initialize_my_player'));if(!a||a!==b)throw new Error('Player initialization is not idempotent');let previous=localStorage.getItem('subway-test-player:'+user.id);if(previous&&previous!==a)throw new Error('Player ID changed across sessions');localStorage.setItem('subway-test-player:'+user.id,a);const unsigned=createClient('https://jxymdjkzbjntfbbyjdfa.supabase.co','sb_publishable_DA9X9DoNOhoBYFMdVGh7JQ_Rzk_xRPI',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'subway-unsigned-test'}});const denied=await unsigned.rpc('get_my_player');if(!denied.error||!(denied.error.code==='42501'||denied.status===401||denied.status===403))throw new Error('Unauthenticated access rejection not verified');const profile=check(await client.rpc('get_my_player'));if(!Array.isArray(profile)||profile.length!==1||profile[0].player_id!==a||Number(profile[0].available_minor)!==100000||!profile[0].username)throw new Error('Unexpected player profile or opening balance');out.textContent='PASS: authenticated guest, repeat initialization and profile API\nAuth user ID: '+user.id+'\nAnonymous: '+user.is_anonymous+'\nPlayer ID: '+a+'\nReturning session: '+(previous?'yes — same player':'first test')+'\nUsername: '+profile[0].username+'\nWallet balance: '+Number(profile[0].available_minor)/100+' Tokens.\nUnauthenticated API access: denied.';}catch(e){out.textContent='FAIL: '+(e.message||String(e));}finally{busy(false);}};
reset.onclick=async()=>{busy(true);try{check(await client.auth.signOut({scope:'local'}));out.textContent='Signed out. Next sign-in creates a new guest. Old guest cannot be recovered through this test page.';}catch(e){out.textContent='FAIL: '+e.message;}finally{busy(false);}};
busy(false);out.textContent='Ready. Click Sign in / initialize guest.';
</script></body></html>
